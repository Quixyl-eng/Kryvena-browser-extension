<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kryvena</title><link rel="stylesheet" href="popup.css"></head><body><header class="header"><div class="logo">✦</div><div><h1>kryvena</h1><p class="subtitle">Настройки помощника</p></div></header><main class="card"><p class="section-title">Провайдер</p><label class="field">Нейросеть<select id="provider"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="gemini">Google Gemini</option><option value="deepseek">DeepSeek</option><option value="custom">Кастомный endpoint</option></select></label><label class="field">API-ключ<input id="apiKey" type="password" autocomplete="off" placeholder="Вставьте ключ"></label><label class="field" id="endpointWrap">URL endpoint<input id="endpoint" placeholder="https://api.tundralabs.ru/v1 или полный /chat/completions"></label><label class="field">Доступная модель<select id="model"><option value="">Введите ключ и обновите список</option></select></label><button class="secondary" id="loadModels" type="button">Обновить список моделей</button><button class="secondary" id="testConnection" type="button">Проверить соединение</button><p id="modelStatus" class="hint" role="status"></p><p class="section-title section-spaced">Поведение</p><label class="toggle"><input id="showFab" type="checkbox"><span>Показывать плавающую кнопку</span></label><button class="save" id="save" type="button">Сохранить настройки</button><div id="message" role="status"></div></main><script src="popup.js"></script></body></html>
